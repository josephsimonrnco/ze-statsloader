name: Generate Stats Images

on:
  push:
    branches: [ master ]
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Check out repository under $GITHUB_WORKSPACE, so the job can access it
    - uses: actions/checkout@v4

    # Dependencies are resolved from pyproject.toml / uv.lock
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install

    # Generate all statistics images
    - name: Generate images
      run: |
        uv run --frozen python generate_images.py
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EXCLUDED: ${{ secrets.EXCLUDED }}
        EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
        EXCLUDE_FORKED_REPOS: true
        # Only needed for genuinely separate GitHub accounts. Former usernames
        # of this account are resolved automatically.
        EXTRA_LOGINS: ${{ secrets.EXTRA_LOGINS }}

    # A scheduled workflow is disabled after 60 days without repository
    # activity. The generated badges are often byte-identical from one day to
    # the next, which produces no commit and no activity -- that is what
    # silently switched this workflow off. The heartbeat guarantees a commit.
    - name: Record run timestamp
      run: date -u +"%Y-%m-%dT%H:%M:%SZ" > generated/last_run.txt

    # Commit all changed files to the repository
    - name: Commit to the repo
      run: |
        git config --global user.name "jstrieb/github-stats"
        git config --global user.email "github-stats[bot]@jstrieb.github.io"
        git add .
        # Force the build to succeed, even if no files were changed
        git commit -m 'Update generated files' || true
        git push
